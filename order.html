<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Your Order - PrettyKnots</title>
</head>
<body>

<header>
    <h1>PrettyKnots ♡</h1>
    <p>Handmade with Love</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="product.html">Products</a>
    <a href="contact.html">Contact</a>
    <a href="order.html">Order</a>
</nav>

<section class="page-heading">
    <h2>Place Your Order</h2>
    <p>Choose your favourite handmade jewelry.</p>
</section>

<section class="order-section">

    <form class="order-form">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Select Product</label>
        <select required>
            <option value="">Choose a bracelet</option>
            <option>Lavender Bracelet - Rs. 850</option>
            <option>Pearl Bracelet - Rs. 950</option>
            <option>Pink Bracelet - Rs. 900</option>
            <option>Flower Bracelet - Rs. 1000</option>
        </select>

        <label>Quantity</label>
        <input type="number" min="1" value="1" required>

        <label>Delivery Address</label>
        <textarea rows="4" placeholder="Enter your address" required></textarea>

        <label>Payment Method</label>
        <select>
            <option>Cash on Delivery</option>
            <option>Bank Transfer</option>
        </select>

        <button type="submit" class="btn">Place Order</button>

    </form>

</section>

<footer>
    <h3>PrettyKnots ♡</h3>
    <p>Handmade with Love</p>
    <p>© 2026 PrettyKnots. All Rights Reserved.</p>
</footer>

</body>
</html>
